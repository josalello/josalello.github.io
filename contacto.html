<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto · josalello</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">josalello</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container section-pad">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="mb-4">Contacto</h1>
        <p>¿Quieres saludar, proponer algo o colaborar? Rellena el formulario y se abrirá tu cliente de correo con el mensaje preparado. ✉️</p>

        <form class="mt-4" onsubmit="return openMailto(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="nombre">Nombre</label>
              <input class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="mensaje">Mensaje</label>
              <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-primary btn-lg" type="submit">Enviar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer fijo -->
  <footer class="site-footer bg-dark text-white text-center d-flex align-items-center justify-content-center fixed-bottom">
    <p class="mb-0 py-3 px-2">&copy; 2025 josalello · Creado con ❤️ y GitHub Pages</p>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    // Construye un mailto legible con los datos del formulario
    function openMailto(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email  = document.getElementById('email').value.trim();
      const msg    = document.getElementById('mensaje').value.trim();

      const subject = encodeURIComponent(`Contacto desde la web · ${nombre}`);
      const body = encodeURIComponent(
        `Nombre: ${nombre}\nEmail: ${email}\n\nMensaje:\n${msg}`
      );

      // Cambia esta dirección por la tuya si quieres
      const to = 'josalello@ejemplo.com';
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
      return false;
    }
  </script>
</body>
</html>
